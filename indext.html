<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dạo Phố Đi Bộ Hồ Ea Kao</title>
<style>
body{margin:0;padding:0;background:#1b4332;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,sans-serif;color:#fff;touch-action:manipulation}
h1{font-size:18px;margin:8px 0 4px;color:#ffd166;text-transform:uppercase}
p{font-size:12px;margin:0 0 8px;color:#b7e4c7}
canvas{border:4px solid #ffd166;border-radius:12px;max-width:95vw;background:#8ecae6}
.ft{font-size:11px;color:#95d5b2;margin-top:8px;text-align:center}
</style>
</head>
<body>
<h1>🌊 Dạo Phố Đi Bộ Hồ Ea Kao</h1>
<p>Chạm màn hình vượt Tạp Hóa Vui Vẻ & Phố Đi Bộ!</p>
<canvas id="c" width="330" height="480"></canvas>
<div class="ft">Tài trợ: <b>Tạp Hóa Vui Vẻ & Tiệm Kem Ngã Tư Ea Kao</b></div>
<script>
var c=document.getElementById("c"),ctx=c.getContext("2d");
var py=210,pv=0,g=0.28,jp=-5.5,px=65,pr=15,obs=[],fc=0,sc=0,over=false,start=false,hit="",wv=0,colIdx=0,lastLv=0,lvTimer=0,deadTime=0,gateX=150;
var topScores=JSON.parse(localStorage.getItem("ek_top3")||"[0,0,0]");
var gObs=[{n:"Bụi Gai",i:"🌵"},{n:"Trơn Trượt",i:"💧"},{n:"Dê Đen",i:"🐐"},{n:"Cá Sấu",i:"🐊"},{n:"Cá Trắm",i:"🐟"}];
var aObs=[{n:"Đại Bàng",i:"🦅"},{n:"Cồng Chiêng",i:"🪘"},{n:"Cá Chép",i:"🐠"}];
var clouds=[{x:40,y:55,s:0.25},{x:180,y:85,s:0.2},{x:290,y:45,s:0.3}];
function getLevel(s){
if(s<30)return 0;
if(s<50)return 1;
if(s<100)return 2;
if(s<=1000)return 3+Math.floor((s-100)/50);
return 21+Math.floor((s-1000)/100);
}
function saveScore(s){
if(s<=0)return;
topScores.push(s);
topScores.sort(function(a,b){return b-a;});
topScores=topScores.slice(0,3);
localStorage.setItem("ek_top3",JSON.stringify(topScores));
}
function die(reason){
if(over)return;
hit=reason;over=true;deadTime=Date.now();
saveScore(sc);
}
function tap(){
if(!start){start=true;return;}
if(over){
if(Date.now()-deadTime<1500)return;
py=210;pv=0;obs=[];sc=0;fc=0;over=false;hit="";colIdx=0;lastLv=0;lvTimer=0;gateX=150;
}else{pv=jp;}
}
c.addEventListener("touchstart",function(e){e.preventDefault();tap();});
c.addEventListener("mousedown",tap);
function drawVText(txt,x,y,h){
if(h<45)return;
ctx.save();ctx.translate(x,y);ctx.rotate(-Math.PI/2);
ctx.fillStyle="#1b4332";ctx.font="bold 11px Arial";ctx.textAlign="center";
ctx.fillText(txt,0,4);ctx.restore();
}
function drawGate(gx){
if(gx<-180)return;
ctx.fillStyle="#d62828";ctx.fillRect(gx,270,12,150);ctx.fillRect(gx+138,270,12,150);
ctx.fillStyle="#ffd166";ctx.fillRect(gx-5,412,22,8);ctx.fillRect(gx+133,412,22,8);
ctx.fillStyle="#9b2226";ctx.beginPath();ctx.moveTo(gx-16,272);ctx.lineTo(gx+75,242);ctx.lineTo(gx+166,272);ctx.closePath();ctx.fill();
ctx.strokeStyle="#ffd166";ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle="#ffd166";ctx.fillRect(gx-4,270,158,28);ctx.strokeStyle="#9b2226";ctx.strokeRect(gx-4,270,158,28);
ctx.fillStyle="#9b2226";ctx.font="bold 10px Arial";ctx.textAlign="center";
ctx.fillText("PHỐ ĐI BỘ HỒ EA KAO",gx+75,288);
}
function loop(){
var lv=getLevel(sc);
if(lv>lastLv){lastLv=lv;lvTimer=90;}
var spd=2.2+Math.min(lv*0.12,2.8);
wv+=spd*0.6;
for(var k=0;k<clouds.length;k++){clouds[k].x-=clouds[k].s;if(clouds[k].x<-50)clouds[k].x=360;}
if(start&&!over){
pv+=g;py+=pv;gateX-=spd;
var spawnRate=Math.max(75,Math.floor(120-lv*1.5));
if(fc>40&&fc%spawnRate===0){
var gap=Math.max(102,130-lv*1.1);
var topH=Math.floor(Math.random()*(340-gap))+45;
var mv=(lv>=2&&Math.random()<(0.25+lv*0.02))?((Math.random()>0.5?1:-1)*(0.35+Math.min(lv*0.05,1.1))):0;
var lbl=(colIdx%2===0)?"TẠP HÓA VUI VẺ":"PHỐ ĐI BỘ EA KAO";
colIdx++;
obs.push({x:330,w:48,t:topH,b:topH+gap,gap:gap,mv:mv,lbl:lbl,a:aObs[Math.floor(Math.random()*3)],g:gObs[Math.floor(Math.random()*5)],p:false});
}
for(var i=0;i<obs.length;i++){var o=obs[i];o.x-=spd;
if(o.mv!==0){o.t+=o.mv;o.b=o.t+o.gap;if(o.t<40||o.b>395)o.mv=-o.mv;}
if(px+pr-4>o.x&&px-pr+4<o.x+o.w){if(py-pr+4<o.t)die(o.a.n+" ("+o.lbl+")");if(py+pr-4>o.b)die(o.g.n+" ("+o.lbl+")");}
if(!o.p&&o.x+o.w<px){sc++;o.p=true;}}
if(obs.length>0&&obs[0].x<-55)obs.shift();
if(py+pr>420)die("Rơi xuống hồ Ea Kao");
if(py-pr<0){py=pr;pv=0;}
fc++;
}
var sky=ctx.createLinearGradient(0,0,0,420);sky.addColorStop(0,"#56cfe1");sky.addColorStop(1,"#caf0f8");
ctx.fillStyle=sky;ctx.fillRect(0,0,330,420);
ctx.fillStyle="rgba(255,255,255,0.92)";
for(var k=0;k<clouds.length;k++){var cl=clouds[k];ctx.beginPath();ctx.arc(cl.x,cl.y,15,0,Math.PI*2);ctx.arc(cl.x+15,cl.y-5,18,0,Math.PI*2);ctx.arc(cl.x+30,cl.y,14,0,Math.PI*2);ctx.fill();}
ctx.fillStyle="#74c69d";ctx.beginPath();ctx.moveTo(0,420);ctx.quadraticCurveTo(165,330,330,420);ctx.fill();
ctx.fillStyle="#e9c46a";ctx.fillRect(0,420,330,16);
ctx.fillStyle="#d4a373";for(var x=-20;x<350;x+=30)ctx.fillRect(x-(wv%30),426,15,3);
ctx.fillStyle="#00b4d8";ctx.fillRect(0,436,330,44);
ctx.fillStyle="#90e0ef";for(var x=-20;x<350;x+=40)ctx.fillRect(x-(wv%40),452,22,3);
drawGate(gateX);
for(var i=0;i<obs.length;i++){var o=obs[i];
ctx.fillStyle="#80ed99";ctx.fillRect(o.x,0,o.w,o.t);ctx.strokeStyle="#2d6a4f";ctx.lineWidth=2;ctx.strokeRect(o.x,0,o.w,o.t);
drawVText(o.lbl,o.x+24,(o.t-28)/2,o.t-28);
ctx.font="22px Arial";ctx.textAlign="center";ctx.fillText(o.a.i,o.x+24,o.t-8);
var bH=420-o.b;
ctx.fillStyle="#80ed99";ctx.fillRect(o.x,o.b,o.w,bH);ctx.strokeRect(o.x,o.b,o.w,bH);
ctx.fillText(o.g.i,o.x+24,o.b+24);
drawVText(o.lbl,o.x+24,o.b+28+(bH-28)/2,bH-28);}
ctx.font="28px Arial";ctx.textAlign="center";ctx.fillText("🏃",px,py+10);
ctx.fillStyle="#1b4332";ctx.font="bold 28px Arial";ctx.fillText(sc,165,42);
ctx.font="bold 12px Arial";ctx.fillText("Cấp độ: "+lv,165,60);
if(lvTimer>0){lvTimer--;ctx.fillStyle="#d62828";ctx.font="bold 16px Arial";ctx.fillText("🔥 QUA ẢI - CẤP "+lv+"!",165,90);}
if(!start){ctx.fillStyle="rgba(0,0,0,0.45)";ctx.fillRect(0,0,330,230);ctx.fillStyle="#ffd166";ctx.font="bold 17px Arial";ctx.fillText("CHẠM ĐỂ QUA CỔNG CHÀO!",165,120);ctx.fillStyle="#fff";ctx.font="12px Arial";ctx.fillText("Vượt qua các mốc 30, 50, 100... thật mượt mà!",165,145);}
if(over){var d=new Date(),ts=d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})+" - "+d.toLocaleDateString('vi-VN');
var canRetry=(Date.now()-deadTime>=1500);
ctx.fillStyle="rgba(0,0,0,0.85)";ctx.fillRect(20,95,290,285);ctx.strokeStyle="#ffd166";ctx.lineWidth=3;ctx.strokeRect(20,95,290,285);
ctx.fillStyle="#ef476f";ctx.font="bold 20px Arial";ctx.fillText("DỪNG BƯỚC RỒI!",165,128);
ctx.fillStyle="#ffd166";ctx.font="bold 13px Arial";ctx.fillText("Va phải: "+hit,165,152);
ctx.fillStyle="#fff";ctx.font="bold 16px Arial";ctx.fillText("Điểm lần này: "+sc+" điểm (Cấp "+lv+")",165,180);
ctx.fillStyle="#80ed99";ctx.font="bold 14px Arial";ctx.fillText("🏆 BẢNG XẾP HẠNG TOP 3 🏆",165,212);
ctx.fillStyle="#fff";ctx.font="13px Arial";
ctx.fillText("🥇 Hạng 1: "+(topScores[0]||0)+" điểm",165,234);
ctx.fillText("🥈 Hạng 2: "+(topScores[1]||0)+" điểm",165,254);
ctx.fillText("🥉 Hạng 3: "+(topScores[2]||0)+" điểm",165,274);
ctx.fillStyle="#b7e4c7";ctx.font="11px Arial";ctx.fillText("Thời gian: "+ts,165,302);
ctx.fillStyle=canRetry?"#ffd166":"#888";ctx.font="bold 14px Arial";
ctx.fillText(canRetry?"👉 Chạm màn hình để chơi lại":"⏳ Đang lưu thành tích...",165,342);}
requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
