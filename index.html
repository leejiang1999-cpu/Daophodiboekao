<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dạo Phố Đi Bộ Hồ Ea Kao</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#1b3b2b;color:#fff;font-family:Arial,sans-serif;text-align:center;overflow:hidden;touch-action:none;user-select:none}
  canvas{background:#74d4fc;border:4px solid #f1c40f;border-radius:12px;max-width:94vw;max-height:75vh;margin-top:6px;display:inline-block}
  h3{margin:6px 0 2px;color:#f1c40f;font-size:16px} .sub{font-size:11px;color:#ddd;margin-bottom:4px}
  #ui{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:15px;z-index:10}
  button{background:#f1c40f;color:#1b3b2b;border:none;padding:12px 30px;font-size:16px;font-weight:bold;border-radius:25px;margin-top:12px;cursor:pointer}
  .top3{background:rgba(255,255,255,.12);padding:10px 20px;border-radius:10px;margin:10px 0;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<h3>🌊 DẠO PHỐ ĐI BỘ HỒ EA KAO</h3>
<div class="sub">Tác giả: Niê Ngọc Hiếu | Vượt Tạp Hóa Vui Vẻ & Phố Đi Bộ</div>
<canvas id="c" width="320" height="480"></canvas>
<div id="ui">
  <h2 id="msg" style="color:#f1c40f;margin:0;font-size:20px">SẴN SÀNG CHƯA BRO?</h2>
  <div id="scTxt" style="margin-top:6px;font-size:14px">Chạm màn hình bay qua các đốt tre Ea Kao!</div>
  <div class="top3" id="board"></div>
  <button id="playBtn" onclick="start()">CHƠI NGAY</button>
</div>
<script>
var c=document.getElementById("c"),x=c.getContext("2d"),ui=document.getElementById("ui");
var by,bv,sc,lv,pipes,run=0,actx,lastT=0,topS=new Array(0,0,0);
try{var s=localStorage.getItem("ek_top");if(s){var a=s.split("|");for(var i=0;i<3;i++)topS[i]=parseInt(a[i])||0}}catch(e){}

function snd(t){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!actx&&AC)actx=new AC();
    if(actx){
      if(actx.state==="suspended")actx.resume();
      var o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;
      o.connect(g);g.connect(actx.destination);
      if(t===1){o.frequency.setValueAtTime(280,n);o.frequency.exponentialRampToValueAtTime(560,n+0.1);g.gain.setValueAtTime(0.2,n);o.start(n);o.stop(n+0.1)}
      if(t===2){o.frequency.setValueAtTime(980,n);o.frequency.setValueAtTime(1318,n+0.07);g.gain.setValueAtTime(0.2,n);o.start(n);o.stop(n+0.25)}
      if(t===3){o.type="sawtooth";o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(40,n+0.25);g.gain.setValueAtTime(0.25,n);o.start(n);o.stop(n+0.25)}
    }
    if(t===3&&"speechSynthesis"in window){
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance("Cố lên bro, xếp hạng nhất trong tháng là có quà xịn đó!");
      u.lang="vi-VN";u.rate=1.0;window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function showTop(){
  document.getElementById("board").innerHTML="<b>🏆 BẢNG XẾP HẠNG TOP 3</b><br>🥇 Top 1: "+topS[0]+" đ<br>🥈 Top 2: "+topS[1]+" đ<br>🥉 Top 3: "+topS[2]+" đ";
}
showTop();

function start(){
  by=220;bv=0;sc=0;lv=0;pipes=new Array();
  ui.style.display="none";run=1;lastT=Date.now();
  requestAnimationFrame(loop);
}

function jump(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(run){bv=-5.6;snd(1)}
}
c.addEventListener("touchstart",jump,{passive:false});
c.addEventListener("mousedown",jump);

function drawTre(px,py,pw,ph,txt){
  if(ph<=0)return;
  var r=ph<24?ph/2:12;
  x.fillStyle="#4cd137";x.strokeStyle="#1e824c";x.lineWidth=3;
  x.beginPath();
  x.moveTo(px+r,py);x.lineTo(px+pw-r,py);x.quadraticCurveTo(px+pw,py,px+pw,py+r);
  x.lineTo(px+pw,py+ph-r);x.quadraticCurveTo(px+pw,py+ph,px+pw-r,py+ph);
  x.lineTo(px+r,py+ph);x.quadraticCurveTo(px,py+ph,px,py+ph-r);
  x.lineTo(px,py+r);x.quadraticCurveTo(px,py,px+r,py);
  x.closePath();x.fill();x.stroke();
  for(var y=py+35;y<py+ph-15;y+=45){x.beginPath();x.moveTo(px,y);x.lineTo(px+pw,y);x.stroke()}
  if(ph>90){
    x.save();x.translate(px+pw/2,py+ph/2);x.rotate(-Math.PI/2);
    x.fillStyle="#0b3b17";x.font="bold 11px Arial,sans-serif";x.textAlign="center";
    x.fillText(txt,0,4);x.restore();
  }
}

function loop(){
  if(!run)return;
  var now=Date.now(),dt=(now-lastT)/16.67;
  if(dt>2.5)dt=1;
  lastT=now;
  requestAnimationFrame(loop);

  x.fillStyle="#74d4fc";x.fillRect(0,0,320,480);
  x.fillStyle="#7bed9f";x.beginPath();x.arc(160,440,180,Math.PI,0);x.fill();
  x.fillStyle="#1e90ff";x.fillRect(0,415,320,45);
  x.fillStyle="#f1c40f";x.fillRect(0,410,320,6);x.fillRect(0,460,320,20);

  lv=sc<100?0:sc<150?1:sc<200?2:sc<2000?3:4;
  var spd=(2.1+lv*0.42)*dt,gap=168-lv*11;

  if(pipes.length===0||pipes[pipes.length-1].x<150){
    var topH=45+Math.random()*(345-gap);
    var lb=(pipes.length%2===0)?"PHỐ ĐI BỘ EA KAO":"TẠP HÓA VUI VẺ";
    pipes.push({x:320,h:topH,g:gap,p:0,t:lb});
  }

  for(var i=0;i<pipes.length;i++){
    var p=pipes[i];
    p.x-=spd;
    drawTre(p.x,-10,52,p.h+10,p.t);
    drawTre(p.x,p.h+p.g,52,410-(p.h+p.g),p.t);
    if(!p.p&&p.x+52<75){p.p=1;sc++;snd(2)}
    if(84>p.x&&66<p.x+52&&(by-9<p.h||by+9>p.h+p.g)){die();return}
  }
  if(pipes.length>0&&pipes[0].x<-60)pipes.shift();

  bv+=0.26*dt;by+=bv*dt;
  if(by>400||by<10){die();return}

  x.save();x.translate(75,by);
  x.rotate(Math.min(0.75,Math.max(-0.75,bv*0.08)));
  x.fillStyle="#6F4E37";x.beginPath();x.ellipse(0,0,14,10,0,0,Math.PI*2);x.fill();
  x.strokeStyle="#3e2723";x.lineWidth=2;x.stroke();
  x.beginPath();x.moveTo(-11,0);x.quadraticCurveTo(0,4,11,0);x.stroke();
  x.restore();

  x.fillStyle="#2f3542";x.font="bold 28px Arial,sans-serif";x.textAlign="center";
  x.fillText(sc,160,45);
  x.font="bold 12px Arial,sans-serif";
  x.fillText("Cấp độ: "+lv+" | TG: Niê Ngọc Hiếu",160,65);
}

function die(){
  run=0;snd(3);
  topS.push(sc);topS.sort(function(a,b){return b-a});topS=topS.slice(0,3);
  try{localStorage.setItem("ek_top",topS.join("|"))}catch(e){}
  document.getElementById("msg").innerText="KẾT THÚC RỒI BRO!";
  document.getElementById("scTxt").innerText="Điểm của bạn: "+sc+" (Cấp độ "+lv+")";
  showTop();ui.style.display="flex";
}
</script>
</body>
</html>
